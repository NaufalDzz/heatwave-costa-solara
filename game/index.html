<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEATWAVE: Costa Solara</title>
<link rel="stylesheet" href="./styles/game.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.min.js" } }</script>
</head>
<body>
<canvas id="scene" aria-label="HEATWAVE: Costa Solara, an open-world crime game"></canvas>

<div id="hud" class="hidden"></div>
<div id="big-message"><div id="big-title"></div><div id="big-sub"></div></div>
